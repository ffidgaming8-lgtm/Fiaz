<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title id="page-title">Redirecting...</title>

<meta id="og-title" property="og:title" content="">
<meta id="og-desc" property="og:description" content="">
<meta id="og-image" property="og:image" content="">
<meta property="og:type" content="website">

<meta name="twitter:card" content="summary_large_image">
<meta id="tw-title" name="twitter:title" content="">
<meta id="tw-desc" name="twitter:description" content="">
<meta id="tw-image" name="twitter:image" content="">

<style>
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#f7f5f0;
    color:#1a1a1a;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    margin:0;
    text-align:center;
    padding:20px;
  }
</style>
</head>
<body>
<p id="msg">Redirecting...</p>

<script>
  const SUPABASE_URL = "https://lgogrnuocpxzhydbanyz.supabase.co";
  const SUPABASE_KEY = "sb_publishable_JU8UB5FJrQY81Gxpm7ZkuQ_DslfF9p9";

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  if(!id){
    document.getElementById('msg').textContent = 'Invalid link.';
  } else {
    fetch(SUPABASE_URL + '/rest/v1/links?id=eq.' + encodeURIComponent(id) + '&select=*', {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
      }
    })
    .then(r => r.json())
    .then(rows => {
      const data = rows && rows[0];
      if(!data){
        document.getElementById('msg').textContent = 'Link not found.';
        return;
      }
      document.getElementById('page-title').textContent = data.title || 'Redirecting';
      document.getElementById('og-title').setAttribute('content', data.title || '');
      document.getElementById('og-desc').setAttribute('content', data.description || '');
      document.getElementById('og-image').setAttribute('content', data.image || '');
      document.getElementById('tw-title').setAttribute('content', data.title || '');
      document.getElementById('tw-desc').setAttribute('content', data.description || '');
      document.getElementById('tw-image').setAttribute('content', data.image || '');

      setTimeout(function(){
        window.location.href = data.target;
      }, 2000);
    })
    .catch(() => {
      document.getElementById('msg').textContent = 'Error loading link.';
    });
  }
</script>
</body>
</html>
